<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">The Testing Trophy</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#64748b">Shape reflects proportion of the suite, not importance</text>

  <!-- center axis for trophy silhouette: cx = 300 -->
  <!-- Tiers, half-widths: E2E top 55->flare 190 (y100-210) ; Integration 190->120 (y210-400) ; Unit 120->75 (y400-520) -->

  <!-- E2E tier -->
  <polygon points="245,100 355,100 490,210 110,210" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Integration tier -->
  <polygon points="110,210 490,210 420,400 180,400" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <!-- Unit tier -->
  <polygon points="180,400 420,400 375,520 225,520" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>

  <!-- divider lines (crisp) -->
  <line x1="110" y1="210" x2="490" y2="210" stroke="#ffffff" stroke-width="3"/>
  <line x1="180" y1="400" x2="420" y2="400" stroke="#ffffff" stroke-width="3"/>

  <!-- Tier labels inside -->
  <text x="300" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">E2E</text>
  <text x="300" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Integration</text>
  <text x="300" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Unit</text>

  <!-- Leader lines + side notes -->
  <!-- E2E -->
  <line x1="490" y1="150" x2="590" y2="130" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="590" y="95" width="330" height="82" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="606" y="117" font-size="12.5" font-weight="700" fill="#991b1b">Playwright / Cypress &#8212; full browser</text>
  <text x="606" y="136" font-size="11.5" fill="#7f1d1d">Critical user journeys only (signup, checkout).</text>
  <text x="606" y="153" font-size="11.5" fill="#7f1d1d">Small count (10&#8211;30). Slow, expensive to maintain.</text>

  <!-- Integration -->
  <line x1="480" y1="300" x2="590" y2="290" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="590" y="245" width="330" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="606" y="268" font-size="12.5" font-weight="700" fill="#1d4ed8">Jest + RTL + MSW &#8212; real DOM, mocked network</text>
  <text x="606" y="287" font-size="11.5" fill="#1e3a8a">Feature behavior from the user's perspective.</text>
  <text x="606" y="304" font-size="11.5" fill="#1e3a8a">Majority of the suite &#8212; highest value-to-cost ratio.</text>
  <text x="606" y="321" font-size="11.5" fill="#1e3a8a" font-weight="700">This is the widest tier &#8212; where most tests live.</text>

  <!-- Unit -->
  <line x1="400" y1="460" x2="590" y2="450" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="590" y="415" width="330" height="82" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="606" y="437" font-size="12.5" font-weight="700" fill="#166534">Jest &#8212; isolated functions, no rendering</text>
  <text x="606" y="456" font-size="11.5" fill="#14532d">Pure reducers, utility functions, Zod schemas, hooks.</text>
  <text x="606" y="473" font-size="11.5" fill="#14532d">Targeted &#8212; only where logic warrants isolation.</text>

  <!-- bottom warning -->
  <rect x="60" y="545" width="840" height="58" rx="9" fill="#fffbeb" stroke="#fde68a"/>
  <text x="480" y="568" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">The mistake to avoid: an inverted pyramid</text>
  <text x="480" y="587" text-anchor="middle" font-size="11.5" fill="#78350f">Many unit tests on implementation details, few integration tests on real workflows &#8212; expensive to maintain, doesn't catch what breaks.</text>
</svg>
