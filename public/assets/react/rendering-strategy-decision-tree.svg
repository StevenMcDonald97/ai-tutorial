<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Rendering strategy decision tree</title>
  <desc id="d">If no routes need server rendering or Server Components, use Vite with a client router. Otherwise choose a React framework: Next.js App Router, React Router v7 framework mode, or TanStack Start.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>
  <rect x="190" y="24" width="500" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="440" y="58" text-anchor="middle" font-size="17" font-weight="600" fill="#1e1b4b">Do any routes need server rendering</text>
  <text x="440" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1e1b4b">(SEO, fast first paint for anonymous users)</text>
  <text x="440" y="104" text-anchor="middle" font-size="15" fill="#3730a3">— or do you want React Server Components?</text>
  <path d="M320 116 L200 196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M560 116 L660 196" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="238" y="160" font-size="15" font-weight="700" fill="#b91c1c">No</text>
  <text x="626" y="160" font-size="15" font-weight="700" fill="#15803d">Yes</text>
  <rect x="40" y="200" width="330" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Client-side SPA</text>
  <text x="205" y="266" text-anchor="middle" font-size="15" fill="#166534">Vite 8 + a client router</text>
  <text x="205" y="292" text-anchor="middle" font-size="14" fill="#166534">React Router (data mode)</text>
  <text x="205" y="314" text-anchor="middle" font-size="14" fill="#166534">or TanStack Router</text>
  <text x="205" y="338" text-anchor="middle" font-size="13" fill="#15803d">Static hosting · no server runtime</text>
  <rect x="470" y="200" width="370" height="200" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="655" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">A React framework</text>
  <text x="655" y="268" text-anchor="middle" font-size="15" fill="#9a3412">Next.js (App Router)</text>
  <text x="655" y="292" text-anchor="middle" font-size="15" fill="#9a3412">React Router v7 (framework mode)</text>
  <text x="655" y="316" text-anchor="middle" font-size="15" fill="#9a3412">TanStack Start</text>
  <text x="655" y="348" text-anchor="middle" font-size="13" fill="#c2410c">Costs: server runtime · server/client boundary</text>
  <text x="655" y="368" text-anchor="middle" font-size="13" fill="#c2410c">· caching model · Server Functions are public endpoints</text>
  <rect x="40" y="430" width="800" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="440" y="457" text-anchor="middle" font-size="14" fill="#334155">Common SaaS shape: a framework or static site for public marketing pages,</text>
  <text x="440" y="479" text-anchor="middle" font-size="14" fill="#334155">and a Vite SPA for the authenticated product — decided explicitly at project start.</text>
</svg>
