<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrRd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="620" fill="#ffffff"/>

  <text x="510" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">The Form Submission Lifecycle</text>
  <text x="510" y="55" text-anchor="middle" font-size="13" fill="#64748b">Three phases, three different owners &#8212; each bridged by a specific function</text>

  <!-- Phase 1 -->
  <rect x="40" y="90" width="260" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="170" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Phase 1: Input</text>
  <text x="170" y="133" text-anchor="middle" font-size="11" fill="#1e40af">(ephemeral)</text>
  <text x="170" y="153" text-anchor="middle" font-size="11" fill="#1e40af">Owner: RHF / local state</text>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#1e40af">Lives until submission,</text>
  <text x="170" y="184" text-anchor="middle" font-size="11" fill="#1e40af">discarded after success</text>

  <line x1="300" y1="140" x2="360" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrF)"/>
  <text x="330" y="130" text-anchor="middle" font-size="10" fill="#334155" font-family="ui-monospace, monospace">handleSubmit</text>

  <!-- Phase 2 -->
  <rect x="370" y="90" width="260" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="500" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Phase 2: Validation</text>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#5b21b6">Sync (Zod) or async</text>
  <text x="500" y="153" text-anchor="middle" font-size="11" fill="#5b21b6">(server-side uniqueness)</text>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#5b21b6">Errors surface back into</text>
  <text x="500" y="184" text-anchor="middle" font-size="11" fill="#5b21b6">Phase 1 state</text>

  <line x1="630" y1="140" x2="690" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrF)"/>
  <text x="660" y="130" text-anchor="middle" font-size="10" fill="#334155" font-family="ui-monospace, monospace">onSubmit(data)</text>

  <!-- Phase 3 -->
  <rect x="700" y="90" width="280" height="100" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="840" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">Phase 3: Mutation</text>
  <text x="840" y="133" text-anchor="middle" font-size="11" fill="#9d174d">(async)</text>
  <text x="840" y="153" text-anchor="middle" font-size="11" fill="#9d174d">Owner: TanStack Query</text>
  <text x="840" y="170" text-anchor="middle" font-size="11" fill="#9d174d" font-family="ui-monospace, monospace">useMutation</text>
  <text x="840" y="184" text-anchor="middle" font-size="11" fill="#9d174d">Distinct from form input state</text>

  <!-- Mutation sub-states -->
  <line x1="840" y1="190" x2="840" y2="222" stroke="#db2777" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="510" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Inside the mutation</text>

  <rect x="640" y="260" width="110" height="46" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
  <text x="695" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d" font-family="ui-monospace, monospace">idle</text>

  <line x1="750" y1="283" x2="780" y2="283" stroke="#475569" stroke-width="2" marker-end="url(#arrF)"/>

  <rect x="790" y="260" width="130" height="46" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
  <text x="855" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d" font-family="ui-monospace, monospace">pending</text>

  <line x1="855" y1="306" x2="855" y2="330" stroke="#475569" stroke-width="2"/>
  <path d="M855,330 L750,330 L750,352" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrGr)"/>
  <path d="M855,330 L960,330 L960,352" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrRd)"/>

  <rect x="670" y="357" width="160" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="750" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" font-family="ui-monospace, monospace">success</text>

  <rect x="880" y="357" width="130" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="945" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" font-family="ui-monospace, monospace">error</text>

  <!-- loop back arrows -->
  <path d="M670,380 C 420,470 220,420 170,270 L170,190" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGr)"/>
  <rect x="280" y="440" width="220" height="26" rx="13" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="390" y="457" text-anchor="middle" font-size="10.5" fill="#166534" font-family="ui-monospace, monospace">reset() &#8212; input discarded</text>

  <path d="M900,403 C 780,520 420,520 210,300 L210,190" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrRd)"/>
  <rect x="330" y="505" width="290" height="26" rx="13" fill="#ffffff" stroke="#fecaca"/>
  <text x="475" y="522" text-anchor="middle" font-size="10.5" fill="#991b1b" font-family="ui-monospace, monospace">setError('root', &#8230;) &#8212; surfaces to input</text>

  <!-- double-gate note -->
  <rect x="40" y="555" width="940" height="50" rx="9" fill="#fffbeb" stroke="#fde68a"/>
  <text x="510" y="576" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Preventing double submission needs both gates</text>
  <text x="510" y="594" text-anchor="middle" font-size="11" fill="#78350f" font-family="ui-monospace, monospace">disabled={isSubmitting || mutation.isPending}  &#8212;  RHF's flag covers Phase 2, the mutation's flag covers Phase 3</text>
</svg>
