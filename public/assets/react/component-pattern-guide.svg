<svg viewBox="0 0 980 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="880" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Component Pattern Selection Guide</text>
  <text x="490" y="55" text-anchor="middle" font-size="13" fill="#64748b">Five patterns, one question each &#8212; synthesized from the "when to use" notes in this section</text>

  <!-- Q1 -->
  <polygon points="190,100 305,152 190,204 75,152" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="190" y="142" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">Multiple coordinated sub-parts,</text>
  <text x="190" y="158" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">consumer needs layout control?</text>
  <text x="190" y="174" text-anchor="middle" font-size="10" fill="#4338ca">(tabs, accordion, menu)</text>

  <line x1="305" y1="152" x2="425" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="365" y="142" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">yes</text>
  <rect x="430" y="113" width="380" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="140" font-size="14" font-weight="700" fill="#14532d">Compound component</text>
  <text x="450" y="160" font-size="11.5" fill="#166534">Share state via Context; consumer controls</text>
  <text x="450" y="177" font-size="11.5" fill="#166534">layout &amp; ordering of the sub-parts</text>

  <line x1="190" y1="204" x2="190" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="206" y="225" font-size="12" fill="#64748b" font-weight="700">no</text>

  <!-- Q2 -->
  <polygon points="190,238 305,290 190,342 75,290" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="190" y="280" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">Behavior + accessibility only,</text>
  <text x="190" y="296" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">zero prescribed markup?</text>
  <text x="190" y="312" text-anchor="middle" font-size="10" fill="#4338ca">(consumer owns all styling)</text>

  <line x1="305" y1="290" x2="425" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="365" y="280" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">yes</text>
  <rect x="430" y="251" width="380" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="278" font-size="14" font-weight="700" fill="#14532d">Headless component</text>
  <text x="450" y="298" font-size="11.5" fill="#166534">A hook with prop getters</text>
  <text x="450" y="315" font-size="11.5" fill="#166534" font-family="ui-monospace, monospace">getTriggerProps / getContentProps</text>

  <line x1="190" y1="342" x2="190" y2="376" stroke="#64748b" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="206" y="363" font-size="12" fill="#64748b" font-weight="700">no</text>

  <!-- Q3 -->
  <polygon points="190,376 305,428 190,480 75,428" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="190" y="418" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">Cross-cutting injection at the</text>
  <text x="190" y="434" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">route/page level, or 3rd-party wrapper?</text>
  <text x="190" y="450" text-anchor="middle" font-size="10" fill="#4338ca">(auth guard, analytics, legacy code)</text>

  <line x1="305" y1="428" x2="425" y2="428" stroke="#16a34a" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="365" y="418" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">yes</text>
  <rect x="430" y="389" width="380" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="416" font-size="14" font-weight="700" fill="#14532d">Higher-order component</text>
  <text x="450" y="436" font-size="11.5" fill="#166534" font-family="ui-monospace, monospace">withAuth(Dashboard)</text>
  <text x="450" y="453" font-size="11.5" fill="#166534">Wraps the whole render output once</text>

  <line x1="190" y1="480" x2="190" y2="514" stroke="#64748b" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="206" y="501" font-size="12" fill="#64748b" font-weight="700">no</text>

  <!-- Q4 -->
  <polygon points="190,514 305,566 190,618 75,566" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="190" y="556" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">Need render control beyond</text>
  <text x="190" y="572" text-anchor="middle" font-size="11.5" fill="#312e81" font-weight="700">what a hook's return value gives you?</text>
  <text x="190" y="588" text-anchor="middle" font-size="10" fill="#4338ca">(e.g. a virtualization library)</text>

  <line x1="305" y1="566" x2="425" y2="566" stroke="#16a34a" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="365" y="556" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">yes</text>
  <rect x="430" y="527" width="380" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="554" font-size="14" font-weight="700" fill="#14532d">Render props</text>
  <text x="450" y="574" font-size="11.5" fill="#166534" font-family="ui-monospace, monospace">renderItem={(item, style) =&gt; &#8230;}</text>
  <text x="450" y="591" font-size="11.5" fill="#166534">The library controls what/when; you control how</text>

  <line x1="190" y1="618" x2="190" y2="670" stroke="#64748b" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="206" y="649" font-size="12" fill="#64748b" font-weight="700">no</text>

  <!-- default outcome -->
  <rect x="40" y="670" width="300" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="60" y="700" font-size="14" font-weight="700" fill="#14532d">Container/presentational</text>
  <text x="60" y="720" font-size="11.5" fill="#166534">via a custom hook &#8212; the modern default</text>
  <text x="60" y="738" font-size="11.5" fill="#166534">Hook owns data/logic; component stays</text>
  <text x="60" y="753" font-size="11.5" fill="#166534">presentational and easy to test</text>

  <!-- footer note -->
  <rect x="430" y="670" width="510" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="695" font-size="12.5" font-weight="700" fill="#334155">Hooks replaced most HOC / render-prop cases</text>
  <text x="450" y="715" font-size="11.5" fill="#475569">Reach for HOCs and render props only for the specific</text>
  <text x="450" y="732" font-size="11.5" fill="#475569">situations above &#8212; everything else defaults to a plain</text>
  <text x="450" y="749" font-size="11.5" fill="#475569">component built on custom hooks.</text>

  <!-- bottom banner -->
  <rect x="40" y="790" width="900" height="70" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="490" y="815" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9d174d">Portals sit outside this tree</text>
  <text x="490" y="836" text-anchor="middle" font-size="11.5" fill="#831843">They solve a different problem &#8212; where a component paints in the DOM, not how consumers compose its API &#8212; so they're not a branch here.</text>
</svg>
