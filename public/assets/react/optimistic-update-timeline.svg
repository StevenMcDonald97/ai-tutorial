<svg viewBox="0 0 940 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrOg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrOr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="680" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Optimistic Update Timeline</text>
  <text x="470" y="55" text-anchor="middle" font-size="13" fill="#64748b">The UI updates before the server confirms &#8212; with a rollback path if it's wrong</text>

  <text x="470" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">onMutate fires immediately</text>

  <!-- 3 steps -->
  <rect x="40" y="100" width="270" height="76" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="58" y="124" font-size="12.5" font-weight="700" fill="#1d4ed8">1. Cancel in-flight queries</text>
  <text x="58" y="144" font-size="10.5" fill="#1e40af" font-family="ui-monospace, monospace">cancelQueries()</text>
  <text x="58" y="161" font-size="10.5" fill="#1e40af">so a stale response can't overwrite</text>

  <line x1="310" y1="138" x2="345" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrO)"/>

  <rect x="355" y="100" width="270" height="76" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="373" y="124" font-size="12.5" font-weight="700" fill="#1d4ed8">2. Snapshot previous data</text>
  <text x="373" y="144" font-size="10.5" fill="#1e40af" font-family="ui-monospace, monospace">getQueryData()</text>
  <text x="373" y="161" font-size="10.5" fill="#1e40af">saved in case a rollback is needed</text>

  <line x1="625" y1="138" x2="660" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrO)"/>

  <rect x="670" y="100" width="230" height="76" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="688" y="124" font-size="12.5" font-weight="700" fill="#1d4ed8">3. Apply optimistic update</text>
  <text x="688" y="144" font-size="10.5" fill="#1e40af" font-family="ui-monospace, monospace">setQueryData()</text>
  <text x="688" y="161" font-size="10.5" fill="#1e40af">UI reflects the change now</text>

  <!-- request in flight -->
  <line x1="470" y1="176" x2="470" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrO)"/>
  <rect x="330" y="220" width="280" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="470" y="242" text-anchor="middle" font-size="11.5" fill="#334155">meanwhile, the real request is in flight&#8230;</text>

  <line x1="470" y1="254" x2="470" y2="285" stroke="#475569" stroke-width="2"/>

  <!-- fork -->
  <path d="M470,285 L470,300 L280,300 L280,325" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#arrOg)"/>
  <path d="M470,285 L470,300 L660,300 L660,325" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#arrOr)"/>
  <text x="290" y="298" font-size="11.5" fill="#16a34a" font-weight="700">resolves</text>
  <text x="600" y="298" font-size="11.5" fill="#dc2626" font-weight="700">rejects</text>

  <!-- success branch -->
  <rect x="130" y="330" width="300" height="70" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="150" y="354" font-size="12.5" font-weight="700" fill="#14532d">Success &#8212; nothing extra to do</text>
  <text x="150" y="374" font-size="10.5" fill="#166534">The optimistic update already matches</text>
  <text x="150" y="390" font-size="10.5" fill="#166534">reality. No onSuccess handler required.</text>

  <!-- error branch -->
  <rect x="510" y="330" width="300" height="70" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="530" y="354" font-size="12.5" font-weight="700" fill="#7f1d1d">onError: roll back</text>
  <text x="530" y="374" font-size="10.5" fill="#991b1b" font-family="ui-monospace, monospace">setQueryData(key, context.previous)</text>
  <text x="530" y="390" font-size="10.5" fill="#991b1b">restores the Step 2 snapshot</text>

  <!-- converge -->
  <path d="M280,400 L280,430 L470,430" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M660,400 L660,430 L470,430" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

  <rect x="290" y="435" width="360" height="70" rx="9" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="470" y="459" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9d174d">onSettled: always runs</text>
  <text x="470" y="479" text-anchor="middle" font-size="10.5" fill="#9d174d" font-family="ui-monospace, monospace">invalidateQueries()</text>
  <text x="470" y="495" text-anchor="middle" font-size="10.5" fill="#9d174d">refetches the real data either way</text>

  <!-- bottom banner -->
  <rect x="40" y="545" width="860" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="470" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">queryKey design is what makes step 1 and step 3 safe</text>
  <text x="470" y="596" text-anchor="middle" font-size="11.5" fill="#475569">Treat keys as a hierarchy: ['invoices'] &#8594; ['invoices', filters] &#8594; ['invoices', id].</text>
  <text x="470" y="616" text-anchor="middle" font-size="11.5" fill="#475569">Invalidating ['invoices'] invalidates every level beneath it in one call.</text>
  <text x="470" y="640" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="700">Inconsistent keys are the most common cause of stale-data bugs in this pattern.</text>
</svg>
