<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Suspense Boundary Granularity</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#64748b">Where you place the boundary is a UX decision, not a performance detail</text>

  <!-- ===================== LEFT: COARSE ===================== -->
  <text x="235" y="90" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b91c1c">Coarse &#8212; one boundary at the root</text>
  <rect x="60" y="105" width="350" height="15" rx="4" fill="none"/>
  <!-- outer suspense boundary -->
  <rect x="60" y="108" width="350" height="330" rx="10" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="75" y="128" font-size="11" fill="#b91c1c" font-family="ui-monospace, monospace">&lt;Suspense fallback=&lt;FullPageSpinner/&gt;&gt;</text>

  <!-- skeleton fill representing whole blocked UI -->
  <rect x="80" y="140" width="310" height="280" rx="8" fill="#fef2f2"/>
  <!-- spinner -->
  <circle cx="235" cy="255" r="26" fill="none" stroke="#fecaca" stroke-width="7"/>
  <path d="M235,229 A26,26 0 0 1 261,255" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <text x="235" y="310" text-anchor="middle" font-size="12.5" fill="#991b1b" font-weight="600">Waiting for the slowest source&#8230;</text>
  <text x="235" y="330" text-anchor="middle" font-size="11.5" fill="#b91c1c">(header, filters, chart &amp; table all hidden)</text>

  <rect x="60" y="450" width="350" height="66" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="235" y="475" text-anchor="middle" font-size="12.5" fill="#7f1d1d" font-weight="600">Everything blocks on everything</text>
  <text x="235" y="495" text-anchor="middle" font-size="11.5" fill="#7f1d1d">A fast cached header waits on the slowest chart query</text>

  <!-- ===================== RIGHT: FINE-GRAINED ===================== -->
  <text x="725" y="90" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">Fine-grained &#8212; one boundary per region</text>
  <rect x="550" y="108" width="350" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- Header region -->
  <rect x="565" y="122" width="320" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="580" y="142" font-size="11.5" font-weight="700" fill="#166534">UserHeader</text>
  <text x="580" y="158" font-size="10.5" fill="#166534">&#10003; ready instantly &#8212; cached</text>

  <!-- Filters region -->
  <rect x="565" y="176" width="320" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="580" y="196" font-size="11.5" font-weight="700" fill="#166534">FilterPanel</text>
  <text x="580" y="212" font-size="10.5" fill="#166534">&#10003; ready in ~200ms</text>

  <!-- Chart region (loading) -->
  <rect x="565" y="230" width="153" height="98" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="580" y="250" font-size="11.5" font-weight="700" fill="#92400e">RevenueChart</text>
  <circle cx="641" cy="288" r="16" fill="none" stroke="#fde68a" stroke-width="5"/>
  <path d="M641,272 A16,16 0 0 1 657,288" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <text x="641" y="318" text-anchor="middle" font-size="10.5" fill="#92400e">loading&#8230;</text>

  <!-- Table region (loading) -->
  <rect x="732" y="230" width="153" height="98" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="747" y="250" font-size="11.5" font-weight="700" fill="#92400e">UserTable</text>
  <circle cx="808" cy="288" r="16" fill="none" stroke="#fde68a" stroke-width="5"/>
  <path d="M808,272 A16,16 0 0 1 824,288" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <text x="808" y="318" text-anchor="middle" font-size="10.5" fill="#92400e">loading&#8230;</text>

  <text x="725" y="410" text-anchor="middle" font-size="10.5" fill="#64748b">(dashed border = its own Suspense boundary)</text>

  <rect x="550" y="450" width="350" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="725" y="475" text-anchor="middle" font-size="12.5" fill="#14532d" font-weight="600">Each region loads independently</text>
  <text x="725" y="495" text-anchor="middle" font-size="11.5" fill="#14532d">Fast parts appear immediately; slow parts don't block them</text>

  <!-- ===================== BOTTOM: nested composition pattern ===================== -->
  <line x1="60" y1="545" x2="900" y2="545" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="480" y="575" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">The standard pattern per region: nest a Suspense boundary inside an Error Boundary</text>

  <g font-family="ui-monospace, 'SF Mono', Consolas, monospace">
    <rect x="280" y="595" width="400" height="90" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
    <text x="295" y="614" font-size="11.5" fill="#9d174d" font-weight="700">FeatureErrorBoundary</text>
    <text x="295" y="628" font-size="10" fill="#9d174d">catches render errors in this region</text>

    <rect x="300" y="635" width="360" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="315" y="652" font-size="11.5" fill="#1d4ed8" font-weight="700">Suspense</text>
    <text x="315" y="666" font-size="10" fill="#1d4ed8">catches the loading state</text>

    <rect x="590" y="644" width="55" height="24" rx="5" fill="#e2e8f0"/>
    <text x="617" y="660" text-anchor="middle" font-size="10" fill="#334155">UserHeader</text>
  </g>
</svg>
