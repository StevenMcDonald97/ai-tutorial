<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">List Virtualization: What's Actually in the DOM</text>
  <text x="490" y="55" text-anchor="middle" font-size="13" fill="#64748b">The DOM node count stays constant no matter how many items the list has</text>

  <!-- LEFT: full scrollbar track -->
  <text x="140" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Full list &#8212; 10,000 items</text>
  <rect x="100" y="105" width="80" height="430" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <!-- viewport indicator on the track -->
  <rect x="100" y="240" width="80" height="55" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#64748b">(scroll</text>
  <text x="140" y="344" text-anchor="middle" font-size="10" fill="#64748b">position)</text>

  <!-- connecting dashed lines from viewport indicator to detail panel -->
  <line x1="180" y1="240" x2="260" y2="150" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="180" y1="295" x2="260" y2="470" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- RIGHT: detail panel -->
  <rect x="260" y="105" width="640" height="430" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- top virtual space -->
  <rect x="280" y="120" width="600" height="34" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3,4"/>
  <text x="580" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">&#8593; ~4,970 items above &#8212; not rendered, no DOM nodes exist for them</text>

  <!-- overscan rows top -->
  <rect x="280" y="164" width="600" height="26" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="292" y="182" font-size="10.5" fill="#c2410c">overscan (row 4,988) &#8212; rendered just outside the viewport, as a scroll buffer</text>

  <rect x="280" y="196" width="600" height="26" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="292" y="214" font-size="10.5" fill="#c2410c">overscan (row 4,989)</text>

  <!-- visible viewport rows -->
  <rect x="278" y="226" width="604" height="182" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="880" y="242" text-anchor="end" font-size="10" fill="#1d4ed8" font-weight="700">visible viewport</text>

  <g font-size="11">
    <rect x="290" y="250" width="580" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="266" fill="#1e3a8a">row 4,990 &#8212; InvoiceRow (rendered, on screen)</text>

    <rect x="290" y="280" width="580" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="296" fill="#1e3a8a">row 4,991 &#8212; InvoiceRow (rendered, on screen)</text>

    <rect x="290" y="310" width="580" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="326" fill="#1e3a8a">row 4,992 &#8212; InvoiceRow (rendered, on screen)</text>

    <rect x="290" y="340" width="580" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="356" fill="#1e3a8a">row 4,993 &#8212; InvoiceRow (rendered, on screen)</text>

    <rect x="290" y="370" width="580" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="386" fill="#1e3a8a">&#8942; (~50 rows fit the viewport height)</text>
  </g>

  <!-- overscan rows bottom -->
  <rect x="280" y="414" width="600" height="26" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="292" y="432" font-size="10.5" fill="#c2410c">overscan (row 5,040)</text>

  <rect x="280" y="446" width="600" height="26" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="292" y="464" font-size="10.5" fill="#c2410c">overscan (row 5,041) &#8212; rendered just outside the viewport</text>

  <!-- bottom virtual space -->
  <rect x="280" y="478" width="600" height="34" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3,4"/>
  <text x="580" y="500" text-anchor="middle" font-size="11.5" fill="#94a3b8">&#8595; ~4,958 items below &#8212; not rendered, no DOM nodes exist for them</text>

  <!-- stat callout -->
  <g>
    <rect x="100" y="555" width="780" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="270" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a" font-family="ui-monospace, monospace">10,000</text>
    <text x="270" y="608" text-anchor="middle" font-size="11.5" fill="#166534">items in the data</text>

    <text x="470" y="592" text-anchor="middle" font-size="20" fill="#94a3b8">&#8594;</text>

    <text x="650" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a" font-family="ui-monospace, monospace">~55</text>
    <text x="650" y="605" text-anchor="middle" font-size="11" fill="#166534">DOM nodes rendered at once (50 + 5 overscan)</text>
    <text x="650" y="619" text-anchor="middle" font-size="11" fill="#166534">&#8212; constant, regardless of list size</text>
  </g>
</svg>
