<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrGy2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Structural Sharing</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">Immutable updates copy only the changed path &#8212; everything else keeps its reference</text>

  <!-- panel headers -->
  <rect x="45" y="76" width="380" height="26" rx="6" fill="#f1f5f9"/>
  <text x="235" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Before update</text>

  <rect x="503" y="76" width="380" height="26" rx="6" fill="#fef3c7"/>
  <text x="693" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">After adding item to list[2]</text>

  <!-- ===================== LEFT TREE (neutral) ===================== -->
  <g stroke="#64748b" stroke-width="1.7" fill="none">
    <path d="M225,148 L225,175 L119,175 L119,205" marker-end="url(#arrGy2)"/>
    <path d="M225,148 L225,205" marker-end="url(#arrGy2)"/>
    <path d="M225,148 L225,175 L331,175 L331,205" marker-end="url(#arrGy2)"/>
    <path d="M331,245 L331,275 L225,275 L225,305" marker-end="url(#arrGy2)"/>
    <path d="M331,245 L331,305" marker-end="url(#arrGy2)"/>
    <path d="M331,245 L331,275 L437,275 L437,305" marker-end="url(#arrGy2)"/>
  </g>
  <g font-size="11.5" fill="#1e293b" font-weight="700">
    <rect x="180" y="108" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="225" y="133" text-anchor="middle">root</text>

    <rect x="74" y="205" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="119" y="230" text-anchor="middle">user</text>

    <rect x="180" y="205" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="225" y="230" text-anchor="middle">settings</text>

    <rect x="286" y="205" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="331" y="230" text-anchor="middle">list</text>

    <rect x="180" y="305" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="225" y="330" text-anchor="middle" font-size="10.5">list[0]</text>

    <rect x="286" y="305" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="331" y="330" text-anchor="middle" font-size="10.5">list[1]</text>

    <rect x="392" y="305" width="90" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
    <text x="437" y="330" text-anchor="middle" font-size="10.5">list[2]</text>
  </g>

  <!-- ===================== RIGHT TREE (offset +458, colored) ===================== -->
  <g stroke="#64748b" stroke-width="1.7" fill="none">
    <path d="M683,148 L683,175 L577,175 L577,205" marker-end="url(#arrGy2)"/>
    <path d="M683,148 L683,205" marker-end="url(#arrGy2)"/>
    <path d="M683,148 L683,175 L789,175 L789,205" marker-end="url(#arrGy2)"/>
    <path d="M789,245 L789,275 L683,275 L683,305" marker-end="url(#arrGy2)"/>
    <path d="M789,245 L789,305" marker-end="url(#arrGy2)"/>
    <path d="M789,245 L789,275 L895,275 L895,305" marker-end="url(#arrGy2)"/>
  </g>
  <g font-size="11.5" font-weight="700">
    <rect x="638" y="108" width="90" height="40" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="683" y="133" text-anchor="middle" fill="#92400e">root</text>

    <rect x="532" y="205" width="90" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="577" y="230" text-anchor="middle" fill="#1d4ed8">user</text>

    <rect x="638" y="205" width="90" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="683" y="230" text-anchor="middle" fill="#1d4ed8">settings</text>

    <rect x="744" y="205" width="90" height="40" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="789" y="230" text-anchor="middle" fill="#92400e">list</text>

    <rect x="638" y="305" width="90" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="683" y="330" text-anchor="middle" font-size="10.5" fill="#1d4ed8">list[0]</text>

    <rect x="744" y="305" width="90" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="789" y="330" text-anchor="middle" font-size="10.5" fill="#1d4ed8">list[1]</text>

    <rect x="850" y="305" width="90" height="40" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
    <text x="895" y="330" text-anchor="middle" font-size="10.5" fill="#92400e">list[2]</text>
  </g>

  <!-- one representative "shared identity" connector, routed clear of every other box -->
  <path d="M119,245 L119,268 L577,268 L577,245" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="270" y="256" width="120" height="22" rx="11" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="330" y="271" text-anchor="middle" font-size="10" fill="#1d4ed8" font-style="italic">same object</text>

  <!-- legend -->
  <g font-size="11.5">
    <rect x="45" y="365" width="16" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="68" y="378" fill="#334155">New object &#8212; copied because something on its path changed</text>

    <rect x="470" y="365" width="16" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="493" y="378" fill="#334155">Shared object &#8212; same reference, reused unchanged</text>
  </g>
  <text x="500" y="393" text-anchor="middle" font-size="10.5" fill="#94a3b8">(dashed line above shows one pair as an example; the rest follow the same coloring)</text>

  <!-- bottom banner -->
  <rect x="45" y="410" width="910" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="435" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">The full-clone misconception</text>
  <text x="500" y="459" text-anchor="middle" font-size="12" fill="#475569">Only 4 of 7 objects were copied &#8212; every node on the path from root to the changed leaf.</text>
  <text x="500" y="477" text-anchor="middle" font-size="12" fill="#475569">user and settings, and the two untouched list items, were never touched &#8212; same objects before and after.</text>
  <text x="500" y="495" text-anchor="middle" font-size="12" fill="#475569">This is what makes React.memo, useEffect deps, and Redux selectors cheap: they compare references (===),</text>
  <text x="500" y="513" text-anchor="middle" font-size="12" fill="#475569">and unchanged branches always pass that check instantly. Immer's produce() does this automatically.</text>
</svg>
