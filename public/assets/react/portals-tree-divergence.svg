<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#db2777"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Portals: Same React Tree, Different DOM Tree</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#64748b">createPortal keeps the component logically nested, but physically moves its output</text>

  <!-- panel headers -->
  <rect x="55" y="76" width="410" height="28" rx="6" fill="#dbeafe"/>
  <text x="260" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">React Tree &#8212; context, events &amp; error boundaries flow here</text>

  <rect x="495" y="76" width="410" height="28" rx="6" fill="#fce7f3"/>
  <text x="700" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#9d174d">DOM Tree &#8212; where pixels actually paint</text>

  <!-- LEFT: React tree -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <path d="M260,140 L260,158" marker-end="url(#arrB)"/>
    <path d="M260,190 L260,208" marker-end="url(#arrB)"/>
    <path d="M260,240 L260,258" marker-end="url(#arrB)"/>
  </g>
  <g font-size="12.5" fill="#1e293b">
    <rect x="195" y="118" width="130" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="260" y="143" text-anchor="middle" font-weight="700">App</text>

    <rect x="195" y="168" width="130" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="260" y="193" text-anchor="middle" font-weight="700">Layout</text>

    <rect x="195" y="218" width="130" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="260" y="243" text-anchor="middle" font-weight="700">Page</text>
    <text x="260" y="266" text-anchor="middle" font-size="10" fill="#b91c1c">overflow: hidden</text>

    <rect x="185" y="286" width="150" height="44" rx="7" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="260" y="313" text-anchor="middle" font-weight="700" fill="#9d174d">Modal</text>
  </g>
  <line x1="260" y1="258" x2="260" y2="286" stroke="#db2777" stroke-width="2" marker-end="url(#arrPink)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#475569">Still nested under &lt;Page&gt; here &#8212;</text>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#475569">context/events/error boundaries work normally</text>

  <!-- dashed clip box around Page hinting at the problem -->
  <rect x="175" y="212" width="170" height="58" rx="8" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- RIGHT: DOM tree -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none">
    <path d="M700,158 L700,190"/>
    <path d="M700,190 L620,190 L620,208" marker-end="url(#arrGray)"/>
    <path d="M700,190 L790,190 L790,208" marker-end="url(#arrGray)"/>
  </g>
  <g font-size="12.5" fill="#1e293b">
    <rect x="635" y="118" width="130" height="40" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="700" y="143" text-anchor="middle" font-weight="700" font-family="ui-monospace, monospace">&lt;body&gt;</text>

    <!-- clipped app root, showing overflow hidden clipping -->
    <clipPath id="clipRoot"><rect x="555" y="208" width="130" height="90"/></clipPath>
    <rect x="555" y="208" width="130" height="90" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="620" y="230" text-anchor="middle" font-size="11" font-weight="700" font-family="ui-monospace, monospace">#root</text>
    <text x="620" y="248" text-anchor="middle" font-size="10" fill="#64748b">App &gt; Layout &gt; Page</text>
    <text x="620" y="264" text-anchor="middle" font-size="9.5" fill="#b91c1c">(clips overflow here)</text>

    <rect x="725" y="208" width="130" height="90" rx="7" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="790" y="234" text-anchor="middle" font-weight="700" fill="#9d174d">Modal</text>
    <text x="790" y="252" text-anchor="middle" font-size="10" fill="#9d174d">rendered as a</text>
    <text x="790" y="266" text-anchor="middle" font-size="10" fill="#9d174d">sibling of #root</text>
  </g>

  <text x="700" y="352" text-anchor="middle" font-size="11.5" fill="#475569">...but painted directly under &lt;body&gt; here &#8212;</text>
  <text x="700" y="368" text-anchor="middle" font-size="11.5" fill="#475569">escapes Page's clipping/stacking context entirely</text>

  <!-- crossing curved arrow connecting the two Modal boxes, routed beneath both boxes -->
  <path d="M335,316 C 460,332 590,332 718,296" fill="none" stroke="#db2777" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrPink)"/>
  <rect x="390" y="306" width="220" height="24" rx="12" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#9d174d" font-family="ui-monospace, monospace">createPortal(&#8230;, document.body)</text>

  <!-- bottom banner -->
  <rect x="55" y="440" width="850" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Why this is necessary</text>
  <text x="480" y="494" text-anchor="middle" font-size="12" fill="#475569">A modal rendered inside a parent with "overflow: hidden" or a CSS "transform" will be</text>
  <text x="480" y="514" text-anchor="middle" font-size="12" fill="#475569">clipped or mis-stacked no matter its z-index &#8212; that stacking context can't be escaped with CSS alone,</text>
  <text x="480" y="534" text-anchor="middle" font-size="12" fill="#475569">only by physically moving the DOM node. A portal does exactly that, while every React feature</text>
  <text x="480" y="554" text-anchor="middle" font-size="12" fill="#475569">that depends on tree position &#8212; context, bubbling events, error boundaries &#8212; still works, because</text>
  <text x="480" y="574" text-anchor="middle" font-size="12" fill="#475569">the component's place in the React tree never changed.</text>
</svg>
