<text x="24.00" y="320.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Cover the labels and judge each pair. Most people read position and length near-exactly, underestimate the area ratio badly,</text>
<text x="24.00" y="336.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">and cannot recover a ratio from colour at all.  Cleveland &amp; McGill 1984; replicated by Heer &amp; Bostock 2010.</text>
