<text x="24.00" y="262.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">All four: mean x = 9.0, mean y = 7.50, variance and correlation equal to two decimal places, same regression line.</text>
<text x="24.00" y="282.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Summary statistics without a plot conceal structure. Overplotting conceals it from the other direction —</text>
