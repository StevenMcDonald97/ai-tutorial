<text x="24.00" y="250.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Choropleth: rate is readable, but big empty regions dominate visually and small dense ones vanish.</text>
<text x="24.00" y="270.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Cartogram: area now encodes population, so visual weight matches where people are — at the cost of recognisable shape.</text>
<text x="24.00" y="290.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Dot density: conveys magnitude and rough distribution without area-based shading, and does not imply uniformity within a unit.</text>
<text x="24.00" y="316.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">All three are the same data. None is neutral.</text>
