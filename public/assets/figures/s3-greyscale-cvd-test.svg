<rect x="290.00" y="190.00" width="66.00" height="46.00" fill="#6a6a6a" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="364.00" y="190.00" width="66.00" height="46.00" fill="#979797" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="520.00" y="190.00" width="66.00" height="46.00" fill="#4d4897" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="594.00" y="190.00" width="66.00" height="46.00" fill="#bec44d" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="24.00" y="300.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Roughly one man in twelve has some colour-vision deficiency. If removing colour destroys the chart, colour was load-bearing.</text>
<text x="24.00" y="320.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Redundant encoding — position, shape, direct label, luminance difference — is what makes colour safe.</text>
