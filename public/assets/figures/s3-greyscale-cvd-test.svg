<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="800" height="330" fill="#FBFAF7"/>
<text x="24.00" y="30.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">The ten-second test: greyscale and colour-vision simulation</text>
<text x="60.00" y="64.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Red / green status</text>
<text x="130.00" y="52.00" font-size="11" fill="#22201C" text-anchor="middle" font-weight="400" opacity="1">as designed</text>
<rect x="60.00" y="72.00" width="66.00" height="46.00" fill="#C0392B" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="134.00" y="72.00" width="66.00" height="46.00" fill="#27AE60" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="360.00" y="52.00" font-size="11" fill="#22201C" text-anchor="middle" font-weight="400" opacity="1">greyscale</text>
<rect x="290.00" y="72.00" width="66.00" height="46.00" fill="#6a6a6a" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="364.00" y="72.00" width="66.00" height="46.00" fill="#989898" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="360.00" y="138.00" font-size="10.5" fill="#C0503A" text-anchor="middle" font-weight="400" opacity="1">nearly identical greys</text>
<text x="590.00" y="52.00" font-size="11" fill="#22201C" text-anchor="middle" font-weight="400" opacity="1">deuteranopia</text>
<rect x="520.00" y="72.00" width="66.00" height="46.00" fill="#9fa630" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="594.00" y="72.00" width="66.00" height="46.00" fill="#73697e" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<rect x="516.00" y="68.00" width="156.00" height="54.00" fill="none" stroke="#C0503A" stroke-width="1.5" rx="4" opacity="1"/>
<text x="590.00" y="138.00" font-size="10.5" fill="#C0503A" text-anchor="middle" font-weight="400" opacity="1">distinction lost</text>
<text x="60.00" y="182.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Blue / orange status</text>
<rect x="60.00" y="190.00" width="66.00" height="46.00" fill="#2C6EA5" stroke="none" stroke-width="1" rx="3" opacity="1"/>
