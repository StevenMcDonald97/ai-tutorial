<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="760" height="290" fill="#FBFAF7"/>
<text x="24.00" y="30.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Gap size is an encoding, not a spacing preference</text>
<text x="70.00" y="60.00" font-size="11.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Equal gaps — reads as six bars</text>
<line x1="64.00" y1="200.00" x2="320.00" y2="200.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<rect x="70.00" y="99.25" width="26.00" height="100.75" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="106.00" y="122.00" width="26.00" height="78.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="142.00" y="110.62" width="26.00" height="89.38" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="178.00" y="84.62" width="26.00" height="115.38" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="214.00" y="128.50" width="26.00" height="71.50" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="250.00" y="105.75" width="26.00" height="94.25" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<text x="430.00" y="60.00" font-size="11.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Grouped gaps — reads as three pairs</text>
<line x1="424.00" y1="200.00" x2="680.00" y2="200.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<rect x="430.00" y="99.25" width="26.00" height="100.75" fill="#C0503A" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="460.00" y="122.00" width="26.00" height="78.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="512.00" y="110.62" width="26.00" height="89.38" fill="#C0503A" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="542.00" y="84.62" width="26.00" height="115.38" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="594.00" y="128.50" width="26.00" height="71.50" fill="#C0503A" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<rect x="624.00" y="105.75" width="26.00" height="94.25" fill="#D6D2C8" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<line x1="400.00" y1="62.00" x2="400.00" y2="210.00" stroke="#D6D2C8" stroke-width="1" opacity="1" stroke-linecap="round"/>
<text x="24.00" y="242.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Identical values. Proximity decides whether the viewer sees six independent bars or three paired comparisons —</text>
<text x="24.00" y="262.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">and the viewer's reading is the one the whitespace produced, whether or not the designer intended it.</text>
</svg>