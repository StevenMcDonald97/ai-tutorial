<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="880" height="420" fill="#FBFAF7"/>
<text x="24.00" y="30.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">The annotation layer, added one element at a time</text>
<text x="70.00" y="60.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Medication Adherence</text>
<text x="70.00" y="76.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1"></text>
<line x1="70.00" y1="246.00" x2="400.00" y2="246.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="70.00" y1="96.00" x2="70.00" y2="246.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<path d="M 70.00 216.00 L 89.41 216.00 L 108.82 211.00 L 128.24 221.00 L 147.65 216.00 L 167.06 206.00 L 186.47 191.00 L 205.88 181.00 L 225.29 176.00 L 244.71 166.00 L 264.12 161.00 L 283.53 161.00 L 302.94 156.00 L 322.35 156.00 L 341.76 151.00 L 361.18 151.00 L 380.59 151.00 L 400.00 151.00" fill="none" stroke="#22201C" stroke-width="2.2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480.00" y="56.00" font-size="12.5" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Adherence rose 13 points over 18 months,</text>
<text x="480.00" y="72.00" font-size="12.5" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">with most of the gain after the programme launch</text>
<text x="480.00" y="88.00" font-size="9" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Patients with ≥2 refills, N=4,120. PDC ≥ 80%. Jan 2024 – Jun 2025. No control group.</text>
<line x1="480.00" y1="252.00" x2="810.00" y2="252.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="480.00" y1="102.00" x2="480.00" y2="252.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="480.00" y1="127.00" x2="810.00" y2="127.00" stroke="#8A857B" stroke-width="1.4" stroke-dasharray="5 3" opacity="1" stroke-linecap="round"/>
<text x="808.00" y="121.00" font-size="10" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">80% clinical target — still below</text>
<line x1="577.06" y1="102.00" x2="577.06" y2="252.00" stroke="#C0503A" stroke-width="1.4" stroke-dasharray="4 3" opacity="1" stroke-linecap="round"/>
<text x="583.06" y="116.00" font-size="10" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">programme launch</text>
<path d="M 480.00 222.00 L 499.41 222.00 L 518.82 217.00 L 538.24 227.00 L 557.65 222.00 L 577.06 212.00 L 596.47 197.00 L 615.88 187.00 L 635.29 182.00 L 654.71 172.00 L 674.12 167.00 L 693.53 167.00 L 712.94 162.00 L 732.35 162.00 L 751.76 157.00 L 771.18 157.00 L 790.59 157.00 L 810.00 157.00" fill="none" stroke="#22201C" stroke-width="2.2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="810.00" cy="157.00" r="3.60" fill="#22201C" stroke="none" stroke-width="1" opacity="1"/>
<text x="816.00" y="161.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">74%</text>
<circle cx="480.00" cy="222.00" r="3.60" fill="#22201C" stroke="none" stroke-width="1" opacity="1"/>
<text x="474.00" y="226.00" font-size="10" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">61%</text>
<text x="480.00" y="286.00" font-size="9" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Source: refill records, internal analysis. Method note: PDC computed over rolling 90 days.</text>
<line x1="450.00" y1="48.00" x2="450.00" y2="300.00" stroke="#D6D2C8" stroke-width="1" opacity="1" stroke-linecap="round"/>
<text x="70.00" y="300.00" font-size="10.5" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Topic title. The reader supplies their own takeaway.</text>
<text x="480.00" y="300.00" font-size="10.5" fill="#3A6EA5" text-anchor="start" font-weight="400" opacity="1">Takeaway inside what the data supports, scope stated, launch marked, target shown.</text>
<text x="24.00" y="348.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Declining to annotate does not produce neutrality. It produces an unguided reader who takes the most salient thing.</text>
<text x="24.00" y="370.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">The 80% target line is the element a purely persuasive version would have omitted — the endpoint is still below it.</text>
<text x="24.00" y="396.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Including what complicates your own claim is what makes the rest of it credible.</text>
</svg>