<text x="24.00" y="296.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">The first panel does not remove the uncertainty. It transfers it, invisibly, to whoever acts on the number.</text>
<text x="24.00" y="318.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Intervals are compact and widely misread. Fan encodings convey 'less certain out here' without interval literacy.</text>
<text x="24.00" y="340.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Quantile dotplots let a reader reason by counting — one dot in twenty falls below 46 — and test well with general audiences.</text>
