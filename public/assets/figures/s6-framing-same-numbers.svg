<text x="24.00" y="278.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Range selection is a framing choice: it changes the conclusion without falsifying a single value.</text>
<text x="24.00" y="300.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">The same is true of the comparison group, the denominator, and the aggregation statistic.</text>
<text x="24.00" y="326.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Arithmetic correctness is a necessary and badly insufficient condition for honesty.</text>
