<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="880" height="380" fill="#FBFAF7"/>
<text x="24.00" y="30.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">A component library is not a design system</text>
<text x="60.00" y="62.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Two products, one shared palette</text>
<rect x="60.00" y="78.00" width="220.00" height="108.00" fill="#FFFFFF" stroke="#D6D2C8" stroke-width="1" rx="2" opacity="1"/>
<text x="72.00" y="96.00" font-size="10.5" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Product A</text>
<rect x="72.00" y="106.00" width="26.00" height="22.00" fill="#2C6EA5" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="108.00" y="121.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">at risk</text>
<rect x="72.00" y="138.00" width="26.00" height="22.00" fill="#8A857B" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="108.00" y="153.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">on track</text>
<rect x="330.00" y="78.00" width="220.00" height="108.00" fill="#FFFFFF" stroke="#D6D2C8" stroke-width="1" rx="2" opacity="1"/>
<text x="342.00" y="96.00" font-size="10.5" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Product B</text>
<rect x="342.00" y="106.00" width="26.00" height="22.00" fill="#2C6EA5" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="378.00" y="121.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">in review</text>
<rect x="342.00" y="138.00" width="26.00" height="22.00" fill="#8A857B" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="378.00" y="153.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">approved</text>
<text x="60.00" y="210.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Same token. Opposite meanings. Both teams believe they are consistent with the system.</text>
<text x="600.00" y="62.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">What was missing</text>
<rect x="600.00" y="84.00" width="20.00" height="18.00" fill="#2C6EA5" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="628.00" y="97.00" font-size="10" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">status.risk</text>
<text x="724.00" y="97.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">at risk</text>
<rect x="600.00" y="114.00" width="20.00" height="18.00" fill="#C89A3C" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="628.00" y="127.00" font-size="10" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">status.review</text>
<text x="724.00" y="127.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">in review</text>
<rect x="600.00" y="144.00" width="20.00" height="18.00" fill="#5E8C4A" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="628.00" y="157.00" font-size="10" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">status.ok</text>
<text x="724.00" y="157.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">on track</text>
<rect x="600.00" y="174.00" width="20.00" height="18.00" fill="#8A6FA8" stroke="none" stroke-width="1" rx="2" opacity="1"/>
<text x="628.00" y="187.00" font-size="10" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">status.forecast</text>
<text x="724.00" y="187.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">forecast</text>
<rect x="594.00" y="78.00" width="250.00" height="126.00" fill="none" stroke="#3A6EA5" stroke-width="1.2" rx="3" opacity="1"/>
<text x="600.00" y="222.00" font-size="10.5" fill="#3A6EA5" text-anchor="start" font-weight="400" opacity="1">Semantic tokens: a business meaning, shipped as code.</text>
<text x="60.00" y="264.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">The six parts of a visualization design system</text>
<rect x="60.00" y="282.00" width="22.00" height="22.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="68.00" y="298.00" font-size="11" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">1</text>
<text x="92.00" y="298.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Chart taxonomy with “when not to use”</text>
<rect x="330.00" y="282.00" width="22.00" height="22.00" fill="#3A6EA5" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="338.00" y="298.00" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400" opacity="1">2</text>
<text x="362.00" y="298.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Semantic encoding tokens</text>
<rect x="600.00" y="282.00" width="22.00" height="22.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="608.00" y="298.00" font-size="11" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">3</text>
<text x="632.00" y="298.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Scale and axis rules</text>
<rect x="60.00" y="316.00" width="22.00" height="22.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="68.00" y="332.00" font-size="11" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">4</text>
<text x="92.00" y="332.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Accessibility acceptance criteria</text>
<rect x="330.00" y="316.00" width="22.00" height="22.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="338.00" y="332.00" font-size="11" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">5</text>
<text x="362.00" y="332.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Annotation and titling standards</text>
<rect x="600.00" y="316.00" width="22.00" height="22.00" fill="#D6D2C8" stroke="none" stroke-width="1" rx="3" opacity="1"/>
<text x="608.00" y="332.00" font-size="11" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">6</text>
<text x="632.00" y="332.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Contribution and review model</text>
<text x="24.00" y="372.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">A library governs appearance. A system governs meaning — and only one of those prevents the collision above.</text>
</svg>