<text x="600.00" y="82.00" font-size="10.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Stretched — reads as flat</text>
<text x="24.00" y="292.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Identical values. Perceived steepness is set by the plot's proportions, not by the data.</text>
<text x="24.00" y="314.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Aspect ratio is a quantitative choice with a defensible target. "Resize to fit the slide" is a substantive edit.</text>
