<text x="280.00" y="82.00" font-size="10.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Banked near 45° — slopes judged most accurately</text>
<line x1="600.00" y1="262.00" x2="830.00" y2="262.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
