<text x="66.00" y="210.00" font-size="9.5" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">40</text>
<text x="70.00" y="68.00" font-size="10.5" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">axis from 40</text>
<line x1="300.00" y1="206.00" x2="450.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="300.00" y1="76.00" x2="300.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<rect x="326.00" y="85.05" width="40.00" height="120.95" fill="#C0503A" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<text x="346.00" y="221.00" font-size="10" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">Ours</text>
<text x="346.00" y="79.05" font-size="9.5" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">52.1%</text>
<rect x="388.00" y="93.64" width="40.00" height="112.36" fill="#8A857B" stroke="none" stroke-width="1" rx="1" opacity="1"/>
<text x="408.00" y="221.00" font-size="10" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">Comp.</text>
<text x="408.00" y="87.64" font-size="9.5" fill="#8A857B" text-anchor="middle" font-weight="400" opacity="1">48.4%</text>
<text x="296.00" y="210.00" font-size="9.5" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">0</text>
<text x="300.00" y="68.00" font-size="10.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">axis from 0</text>
<text x="70.00" y="250.00" font-size="10.5" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Displayed ratio ≈ 3:1.  Actual ratio 1.08:1.  Lie factor ≈ 2.8.</text>
<text x="500.00" y="60.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Position encoding — zero is not a meaningful reference</text>
<line x1="500.00" y1="206.00" x2="650.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="500.00" y1="76.00" x2="500.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<path d="M 500.00 85.01 L 516.67 85.47 L 533.33 84.26 L 550.00 83.24 L 566.67 83.80 L 583.33 82.59 L 600.00 82.04 L 616.67 82.78 L 633.33 81.48 L 650.00 81.76" fill="none" stroke="#C0503A" stroke-width="2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.00" y="68.00" font-size="10.5" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">axis from 0</text>
<text x="496.00" y="210.00" font-size="9.5" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">0</text>
