<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="880" height="380" fill="#FBFAF7"/>
<text x="24.00" y="30.00" font-size="13" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">The baseline must match what the encoding claims</text>
<text x="70.00" y="60.00" font-size="12" fill="#22201C" text-anchor="start" font-weight="600" opacity="1">Length encoding — bar length IS the value</text>
<line x1="70.00" y1="206.00" x2="220.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="70.00" y1="76.00" x2="70.00" y2="206.00" stroke="#8A857B" stroke-width="1" opacity="1" stroke-linecap="round"/>
