<path d="M 710.00 163.29 L 726.67 172.57 L 743.33 148.43 L 760.00 128.00 L 776.67 139.14 L 793.33 115.00 L 810.00 103.86 L 826.67 118.71 L 843.33 92.71 L 860.00 98.29" fill="none" stroke="#22201C" stroke-width="2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="710.00" y="68.00" font-size="10.5" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">axis 1.28–1.35</text>
<text x="706.00" y="210.00" font-size="9.5" fill="#8A857B" text-anchor="end" font-weight="400" opacity="1">1.28</text>
<text x="500.00" y="250.00" font-size="10.5" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">Forcing zero compresses the signal into a flat line and conceals it.</text>
<line x1="460.00" y1="52.00" x2="460.00" y2="262.00" stroke="#D6D2C8" stroke-width="1" opacity="1" stroke-linecap="round"/>
<text x="24.00" y="300.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">The folk rule 'always start at zero' is half right and confidently misapplied.</text>
<text x="24.00" y="322.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Length encodings require zero, because truncating breaks the identity between a mark's length and its value.</text>
<text x="24.00" y="344.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Position encodings require the data's meaningful reference point — which for an exchange rate is not zero.</text>
<text x="24.00" y="370.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">State the principle, not the two cases.</text>
</svg>