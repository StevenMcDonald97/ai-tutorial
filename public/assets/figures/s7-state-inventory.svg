<text x="24.00" y="268.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">A mockup shows one state of a system that has at least a dozen. Encoding logic, scale domain behaviour,</text>
<text x="24.00" y="290.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">out-of-range handling and responsive drop order are all invisible in it.</text>
<text x="24.00" y="320.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Two states are load-bearing and almost always omitted:</text>
<text x="44.00" y="342.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">•  Stale — a dashboard silently showing yesterday's numbers is an integrity failure, not a bug.</text>
<text x="44.00" y="364.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">•  Null vs zero — Section 1's rule, arriving as an engineering requirement.</text>
<text x="24.00" y="392.00" font-size="11" fill="#22201C" text-anchor="start" font-weight="400" opacity="1">Everything not written down gets decided by whoever is closest to the deadline.</text>
</svg>