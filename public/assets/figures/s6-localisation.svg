<path d="M 724.00 177.71 L 684.00 167.43 L 644.00 158.86 L 604.00 146.86" fill="none" stroke="#6E8B3D" stroke-width="1.8" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="598.00" y="150.86" font-size="10" fill="#6E8B3D" text-anchor="end" font-weight="400" opacity="1">الإكمال</text>
<text x="604.00" y="232.00" font-size="10" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">decimal: ١٢٤٠٫٥٠</text>
<text x="794.00" y="248.00" font-size="9.5" fill="#C0503A" text-anchor="end" font-weight="400" opacity="1">axis and reading order mirror</text>
<text x="24.00" y="282.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Translated labels routinely run 40–60% longer and break direct labelling. Separators invert between locales.</text>
<text x="24.00" y="304.00" font-size="11" fill="#8A857B" text-anchor="start" font-weight="400" opacity="1">Right-to-left layout mirrors axis direction and reading order, so the whole composition flips.</text>
<text x="24.00" y="328.00" font-size="11" fill="#C0503A" text-anchor="start" font-weight="400" opacity="1">None of this is fixable by swapping strings in a finished design. They are layout rules.</text>
