<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeLab — self test</title>
<style>
  :root{
    --paper:#f4f1ea; --paper-deep:#ece7dc; --surface:#fbf9f4; --surface-raised:#fff;
    --ink:#23211c; --ink-soft:#5f5a4f; --ink-faint:#928c7d; --line:#ddd6c7; --line-soft:#e8e2d5;
    --accent:#7a2e1d; --accent-wash:#f3e4df; --accent-line:#e3c4ba;
    --gold:#9a6a18; --gold-wash:#f6ecd6; --indigo:#33457a; --indigo-wash:#e3e7f2;
    --plum:#5a3566; --plum-wash:#efe6f2; --good:#3f6d4e; --good-wash:#e6efe7;
    --warn:#9c3527; --warn-wash:#f7e4e0; --radius:4px; --radius-lg:8px;
    --sans:-apple-system,system-ui,sans-serif; --read:Georgia,serif; --mono:ui-monospace,Menlo,monospace;
  }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);margin:0;padding:32px;max-width:860px}
  h1{font-size:22px;margin:0 0 6px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:32px 0 12px}
  .tok-k{color:#e0a458;font-weight:500}.tok-s{color:#a3be8c}.tok-n{color:#88b3c8}.tok-c{color:#7a7462;font-style:italic}
  #results{font-family:var(--mono);font-size:13px;line-height:1.7;background:#2a2721;color:#e8e2d1;padding:16px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>CodeLab self test</h1>
<div id="results">running…</div>

<h2>Challenge — cases mode, with locked regions</h2>
<div id="w1"></div>

<h2>Challenge — stdout mode (diff on failure)</h2>
<div id="w2"></div>

<h2>Interactive Jest tutorial — learner writes the tests</h2>
<div id="w3"></div>

<h2>Predict then run</h2>
<div id="w4"></div>

<h2>Playground</h2>
<div id="w5"></div>

<h2>Python (expected to fail offline — checking the error path)</h2>
<div id="w6"></div>

<script src="./codelab.js"></script>
<script>
const store = {};
CodeLab.configure({
  esc: s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  mdInline: s => String(s??'').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'),
  smartMd: s => '<p>' + String(s??'').replace(/`([^`]+)`/g,'<code>$1</code>') + '</p>',
  toast: m => console.log('[toast]', m),
  getState: k => store[k],
  setState: (k,v) => { store[k] = v; },
  onGraded: (k,info) => console.log('[graded]', k, info)
});

// ── Widgets ──────────────────────────────────────────────────────────────
document.getElementById('w1').innerHTML = CodeLab.renderChallenge({
  stateKey:'w1', language:'javascript',
  prompt:'Implement `total` so it sums the `price` of every item.',
  starterCode:
`function total(items) {
  // [[edit]]
  return 0;
  // [[/edit]]
}`,
  functionName:'total',
  check:{ mode:'cases', cases:[
    {args:[[{price:2},{price:3}]], expected:5},
    {args:[[]], expected:0},
    {args:[[{price:10}]], expected:10}
  ]},
  hints:['Array `reduce` takes an accumulator and the current item.','Start the accumulator at `0`.'],
  solution:'function total(items) {\n  return items.reduce((sum, i) => sum + i.price, 0);\n}',
  misconception:{ misconception:'reduce always starts from the first element', whyIncorrect:'Without an initial value, `reduce` uses element 0 as the seed — which breaks on an empty array.' }
});

document.getElementById('w2').innerHTML = CodeLab.renderChallenge({
  stateKey:'w2', language:'javascript',
  prompt:'Print the numbers 1 to 3, one per line.',
  starterCode:'// [[edit]]\nconsole.log(1);\nconsole.log(2);\n// [[/edit]]',
  check:{ mode:'stdout', expectedOutput:'1\n2\n3', match:'trim' }
});

document.getElementById('w3').innerHTML = CodeLab.renderChallenge({
  stateKey:'w3', language:'javascript',
  prompt:'`slugify` is written for you. Write tests that prove it works.',
  starterCode:
`function slugify(s) {
  return s.trim().toLowerCase().replace(/\\s+/g, '-');
}

// [[edit]]
describe('slugify', () => {
  it('lowercases', () => {
    expect(slugify('Hello')).toBe('hello');
  });
});
// [[/edit]]`,
  check:{ mode:'tests', minimumTests:2 }
});

document.getElementById('w4').innerHTML = CodeLab.renderPredictRun({
  stateKey:'w4', language:'javascript',
  prompt:'Read carefully before you run it.',
  sourceOverride:"const xs = [1, 2, 3];\nconst ys = xs;\nys.push(4);\nconsole.log(xs.length);",
  explanation:'`ys` is another name for the same array, not a copy.'
});

document.getElementById('w5').innerHTML = CodeLab.renderPlayground({
  stateKey:'w5', language:'javascript',
  starterCode:"console.log('edit me and press Run');"
});

document.getElementById('w6').innerHTML = CodeLab.renderPlayground({
  stateKey:'w6', language:'python',
  starterCode:"print('hello from python')"
});

CodeLab.mount();

// ── Headless assertions ──────────────────────────────────────────────────
const out = [];
function check(name, cond, detail){ out.push((cond?'  PASS  ':'  FAIL  ')+name+(detail&&!cond?'  ('+detail+')':'')); }
function render(){ document.getElementById('results').textContent = out.join('\n'); }

(async function(){
  out.push('── pure functions ──');
  const segs = CodeLab.parseRegions('a\n// [[edit]]\nb\n// [[/edit]]\nc');
  check('parseRegions splits 3 segments', segs.length===3, JSON.stringify(segs.map(s=>s.kind)));
  check('parseRegions marks middle editable', segs[1].kind==='edit' && segs[1].text==='b');
  check('parseRegions line numbers continue', segs[2].startLine===3, 'got '+segs[2].startLine);
  check('no markers ⇒ whole thing editable', CodeLab.parseRegions('x\ny')[0].kind==='edit');
  check('assembleSource rebuilds', CodeLab.assembleSource(segs,['ZZ'])==='a\nZZ\nc');
  check('normalizeOutput trim', CodeLab.normalizeOutput('  a\nb  ','trim')==='a\nb');
  check('normalizeOutput whitespace', CodeLab.normalizeOutput('a   b','normalize-whitespace')==='a b');
  check('isRunnable js/py/sql', CodeLab.isRunnable('js')&&CodeLab.isRunnable('python')&&CodeLab.isRunnable('sqlite'));
  check('isRunnable rejects rust', !CodeLab.isRunnable('rust'));
  check('diffLines flags mismatch', CodeLab.diffLines('a\nb','a\nc','trim')[1].same===false);
  check('scoreFor first-try pass = 1', CodeLab.scoreFor({passed:true,checkCount:1,hintsUsed:0})===1);
  check('scoreFor third-try pass = 0.6', CodeLab.scoreFor({passed:true,checkCount:3,hintsUsed:0})===0.6);
  check('scoreFor solution caps at 0.3', CodeLab.scoreFor({passed:true,checkCount:1,hintsUsed:0,solutionShown:true})===0.3);
  check('scoreFor fail = 0', CodeLab.scoreFor({passed:false,checkCount:5})===0);
  render();

  out.push(''); out.push('── sandbox: javascript ──'); render();

  let r = await CodeLab.run({language:'javascript', source:'console.log(6*7)'});
  check('basic stdout', r.ok && r.stdout==='42', JSON.stringify(r));

  r = await CodeLab.run({language:'javascript', source:'console.log({a:1,b:[1,2]})'});
  check('object formatting', r.stdout==='{ a: 1, b: [ 1, 2 ] }', r.stdout);

  r = await CodeLab.run({language:'javascript', source:'throw new Error("boom")'});
  check('error captured', !r.ok && /boom/.test(r.error), r.error);

  r = await CodeLab.run({language:'javascript', source:'console.log("before"); throw new Error("x")'});
  check('stdout retained on throw', r.stdout==='before', JSON.stringify(r.stdout));

  r = await CodeLab.run({language:'javascript', source:'while(true){}', timeoutMs:1200});
  check('infinite loop times out', !r.ok && r.timedOut===true, JSON.stringify(r));

  r = await CodeLab.run({language:'javascript', source:'console.log("still alive")'});
  check('sandbox usable after timeout', r.ok && r.stdout==='still alive', JSON.stringify(r));

  r = await CodeLab.run({language:'javascript',
    source:'await new Promise(res=>setTimeout(res,50)); console.log("async done")'});
  check('top-level await', r.ok===true || /await/.test(r.error||''), JSON.stringify(r).slice(0,120));

  r = await CodeLab.run({language:'javascript',
    source:'(async()=>{ await new Promise(r=>setTimeout(r,30)); console.log("promise ok"); })()'});
  check('async IIFE resolves before result', r.stdout==='promise ok', JSON.stringify(r.stdout));

  out.push(''); out.push('── sandbox: isolation ──'); render();

  r = await CodeLab.run({language:'javascript', source:'console.log(typeof window.parent.document)'});
  check('cannot reach parent document', !r.ok || r.stdout!=='object', JSON.stringify(r).slice(0,140));

  r = await CodeLab.run({language:'javascript', source:'console.log(typeof localStorage)'});
  check('no localStorage in worker', r.ok && r.stdout==='undefined', JSON.stringify(r.stdout));

  out.push(''); out.push('── checker: cases ──'); render();

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'function add(a,b){return a+b}',
    payload:{functionName:'add', cases:[{args:[1,2],expected:3},{args:[-1,1],expected:0}]}});
  check('all cases pass', r.cases && r.cases.every(c=>c.pass), JSON.stringify(r.cases));

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'function add(a,b){return a*b}',
    payload:{functionName:'add', cases:[{args:[2,3],expected:5}]}});
  check('wrong impl fails with detail', r.cases[0].pass===false && r.cases[0].actualText==='6', JSON.stringify(r.cases));

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'const nope = 1', payload:{functionName:'missing', cases:[]}});
  check('missing function ⇒ helpful error', !r.ok && /No function named/.test(r.error), r.error);

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'function f(){}', payload:{functionName:'f(); evil', cases:[]}});
  check('rejects non-identifier functionName', !r.ok && /Invalid functionName/.test(r.error), r.error);

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'function deep(){return {a:[1,{b:2}]}}',
    payload:{functionName:'deep', cases:[{args:[],expected:{a:[1,{b:2}]}}]}});
  check('deep equality on nested structures', r.cases[0].pass===true, JSON.stringify(r.cases));

  r = await CodeLab.run({language:'javascript', mode:'cases',
    source:'function boom(){throw new Error("nope")}',
    payload:{functionName:'boom', cases:[{args:[],expected:1}]}});
  check('case that throws is reported', r.cases[0].pass===false && /raised|threw/.test(r.cases[0].actualText), JSON.stringify(r.cases));

  out.push(''); out.push('── checker: jest shim ──'); render();

  r = await CodeLab.run({language:'javascript', mode:'tests',
    source:'function add(a,b){return a+b}',
    payload:{testSource:`
      describe('add', () => {
        it('adds', () => { expect(add(1,2)).toBe(3); });
        it('is commutative', () => { expect(add(1,2)).toEqual(add(2,1)); });
      });`}});
  check('2 tests pass', r.tests && r.tests.length===2 && r.tests.every(t=>t.status==='pass'), JSON.stringify(r.tests));
  check('suite path captured', r.tests[0].path.join('')==='add', JSON.stringify(r.tests[0].path));

  r = await CodeLab.run({language:'javascript', mode:'tests',
    source:'function add(a,b){return a-b}',
    payload:{testSource:`describe('add',()=>{ it('adds',()=>{ expect(add(1,2)).toBe(3); }); });`}});
  check('failing test reported', r.tests[0].status==='fail' && /Expected 3/.test(r.tests[0].message), JSON.stringify(r.tests));

  r = await CodeLab.run({language:'javascript', mode:'tests', source:'',
    payload:{testSource:`
      describe('matchers', () => {
        it('not', () => { expect(1).not.toBe(2); });
        it('toContain', () => { expect([1,2,3]).toContain(2); });
        it('toThrow', () => { expect(() => { throw new Error('x') }).toThrow('x'); });
        it('toHaveLength', () => { expect('abc').toHaveLength(3); });
        it('toBeCloseTo', () => { expect(0.1+0.2).toBeCloseTo(0.3); });
        it('toMatch', () => { expect('hello').toMatch(/ell/); });
        it('toHaveProperty', () => { expect({a:{b:1}}).toHaveProperty('a.b', 1); });
        it('mock calls', () => {
          const fn = jest.fn().mockReturnValue(7);
          expect(fn(1,2)).toBe(7);
          expect(fn).toHaveBeenCalledWith(1,2);
          expect(fn).toHaveBeenCalledTimes(1);
        });
      });`}});
  check('matcher suite all pass', r.tests && r.tests.length===8 && r.tests.every(t=>t.status==='pass'),
        JSON.stringify((r.tests||[]).filter(t=>t.status!=='pass')));

  r = await CodeLab.run({language:'javascript', mode:'tests', source:'',
    payload:{testSource:`
      let log = [];
      describe('hooks', () => {
        beforeEach(() => { log.push('b'); });
        afterEach(() => { log.push('a'); });
        it('one', () => { log.push('1'); });
        it('two', () => { log.push('2'); });
      });
      describe('verify', () => {
        it('ran in order', () => { expect(log.join('')).toBe('b1ab2a'); });
      });`}});
  check('beforeEach/afterEach order', r.tests && r.tests.every(t=>t.status==='pass'),
        JSON.stringify((r.tests||[]).map(t=>[t.name,t.status,t.message])));

  r = await CodeLab.run({language:'javascript', mode:'tests', source:'',
    payload:{testSource:`
      describe('async', () => {
        it('awaits', async () => {
          const v = await Promise.resolve(5);
          expect(v).toBe(5);
        });
        it('resolves matcher', () => expect(Promise.resolve('x')).resolves.toBe('x'));
      });`}});
  check('async tests pass', r.tests && r.tests.every(t=>t.status==='pass'),
        JSON.stringify((r.tests||[]).map(t=>[t.name,t.status,t.message])));

  r = await CodeLab.run({language:'javascript', mode:'tests', source:'',
    payload:{testSource:`describe('nest',()=>{ describe('inner',()=>{ it('works',()=>{expect(1).toBe(1)}) }) })`}});
  check('nested describe path', r.tests[0].path.join('>')==='nest>inner', JSON.stringify(r.tests[0].path));

  out.push(''); out.push('── offline runtimes (expected to fail cleanly here) ──'); render();

  r = await CodeLab.run({language:'python', source:'print(1)', timeoutMs:8000});
  check('python failure is explained, not silent', !r.ok && /Python runtime unavailable|network/.test(r.error), (r.error||'').slice(0,90));

  r = await CodeLab.run({language:'rust', source:'fn main(){}'});
  check('unsupported language explained', !r.ok && /cannot run/.test(r.error), r.error);

  const fails = out.filter(l=>l.startsWith('  FAIL')).length;
  out.push('');
  out.push(fails ? ('━━ ' + fails + ' FAILING ━━') : '━━ ALL PASS ━━');
  render();
  window.__TESTS_DONE__ = true;
  window.__TESTS_FAILED__ = fails;
})();
</script>
</body>
</html>
